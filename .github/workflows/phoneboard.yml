# Builds the Delite Phone Board app (phoneboard-app/) for Windows and macOS (Apple Silicon) and
# attaches the installers to a GitHub release. Run it by pushing a tag like phoneboard-v2.0.0,
# or from the Actions tab ("Run workflow").
name: Phone Board app

on:
  push:
    tags: ["phoneboard-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            files: phoneboard-app/dist/*.exe
          - os: macos-latest
            args: --mac
            files: |
              phoneboard-app/dist/*.dmg
              phoneboard-app/dist/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: phoneboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the build with the run
        uses: actions/upload-artifact@v4
        with:
          name: DelitePhoneBoard-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Delite Phone Board ${tag#phoneboard-}" --notes "Desktop app for the station's phone lines. Windows: run the Setup .exe. Mac (Apple Silicon): open the .dmg and drag the app to Applications." --latest=false || true
          shopt -s nullglob
          gh release upload "$tag" dist/*.exe dist/*.dmg dist/*.zip --clobber
